<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<script>
  // Nur über https: sonst meldet der Browser „nicht sicher“ und sperrt das Mikrofon.
  if(location.protocol === "http:" && location.hostname !== "localhost")
    location.replace("https://" + location.host + location.pathname + location.search);
</script>
<title>Aura</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aura">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* Web-Fassung für iPad, iPhone und Browser. Dieselben Skripte wie die
   * Mac-App (konfig, anmeldung, orb, konsole); statt ⌥ Leertaste ein Tipp
   * auf den Ball. */
  :root{--grund:#05070C;--text:#EEF3F8;--leise:#A9B8C7;--akt:#4E6B80;--fehler:#FF9C85}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:var(--grund);overflow:hidden}
  body{
    font-family:"Space Grotesk",-apple-system,sans-serif;font-weight:400;color:var(--text);
    -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .rahmen{
    position:relative;height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    gap:clamp(8px,1.6vh,18px);padding:clamp(56px,9vh,110px) 16px clamp(20px,4vh,48px);
  }
  body.abgemeldet .rahmen{justify-content:center}
  form,.wort,.gespraech > *{position:relative;z-index:1}
  .logo{z-index:1}
  .wort,.zeile,.gehoert{pointer-events:none;text-shadow:0 1px 12px rgba(5,7,12,.9)}
  .logo{
    position:absolute;top:clamp(16px,3vh,36px);right:clamp(18px,4vw,48px);
    font-size:clamp(26px,4.5vw,56px);font-weight:600;letter-spacing:.3em;margin-right:-.3em;
  }
  /* Der Ball sitzt mittig im ganzen Fenster, halb so groß wie die
     Fensterhöhe; Text liegt unten */
  .orbplatz{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:0;
    width:min(50vw,65dvh);height:min(50vw,65dvh);
    cursor:pointer;touch-action:manipulation;
  }
  /* Gezeichnet wird auf der ganzen Fläche – Wörter im Partikelmodus
     brauchen die Breite; der Ball selbst bleibt auf .orbplatz. */
  canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;pointer-events:none;z-index:0}
  .wort{font-size:clamp(13px,1.6vw,17px);letter-spacing:.22em;text-transform:uppercase;color:var(--akt);transition:color .6s;font-weight:500}
  .zeile{min-height:2.6em;max-width:36ch;text-align:center;font-size:clamp(18px,2.4vw,26px);line-height:1.45}
  .gehoert{min-height:1.3em;font-size:clamp(15px,1.8vw,19px);color:var(--leise);text-align:center;max-width:40ch}
  .hilfe{font-size:14px;color:var(--leise);letter-spacing:.03em;text-align:center}
  .eigentum{position:fixed;left:0;right:0;bottom:10px;text-align:center;font-size:11.5px;letter-spacing:.08em;color:var(--leise);opacity:.55;pointer-events:none;z-index:1}

  /* Anmeldung */
  form{display:none;flex-direction:column;gap:12px;width:min(340px,86vw)}
  .gespraech{display:contents}
  body.abgemeldet form{display:flex}
  body.abgemeldet .gespraech{display:none}
  /* 16px und mehr: sonst zoomt Safari beim Antippen ins Feld */
  input,button{
    font:inherit;font-size:17px;color:var(--text);
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);
    border-radius:12px;padding:12px 14px;outline:none;user-select:text;-webkit-user-select:text;
  }
  input:focus{border-color:var(--akt)}
  button{cursor:pointer;background:rgba(78,107,128,.35);font-weight:500}
  button:disabled{opacity:.5;cursor:default}
  .oder{font-size:13px;color:var(--leise);text-align:center;letter-spacing:.04em;margin-top:4px}
  #microsoft{background:rgba(78,107,128,.55)}
  .schalter{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid rgba(255,255,255,.1);cursor:pointer}
  .schalter input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:#4E6B80}
  .schalter .was{font-weight:600;margin-bottom:4px}
  .schalter .wann{font-size:13.5px;color:var(--leise);line-height:1.45}
  .meldung{min-height:1.3em;font-size:14px;color:var(--fehler);text-align:center}
  .abmelden{background:none;border:none;padding:4px;font-size:14px;color:var(--leise);text-decoration:underline;cursor:pointer}

  /* Tafel: Freigaben und Konten (konsole.js) */
  .tafel{
    position:absolute;inset:14px;z-index:5;overflow:auto;padding:22px 22px 18px;border-radius:22px;
    background:#05070C;border:1px solid rgba(255,255,255,.1);text-align:left;
    user-select:text;-webkit-user-select:text;
  }
  .tafel[hidden]{display:none}
  .tafel h2{margin:0 0 12px;font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--leise)}
  .tafel .schliessen{position:absolute;top:12px;right:16px}
  .posten{border-top:1px solid rgba(255,255,255,.1);padding:12px 0}
  .posten .was{font-weight:600;margin-bottom:4px}
  .posten .wann{font-size:12.5px;color:var(--leise);margin-bottom:6px}
  .posten pre{white-space:pre-wrap;font:inherit;font-size:14.5px;line-height:1.45;margin:0 0 10px;max-height:14em;overflow:auto;color:var(--text)}
  .posten .knoepfe{display:flex;gap:10px}
  .posten .knoepfe button{padding:7px 14px;font-size:14px}
  .posten .fehler{color:var(--fehler);font-size:13px;margin-bottom:6px}
  .ablehnen{background:rgba(255,255,255,.05)!important}
  /* Mitschrift rechts: fortlaufend, neue Zeilen unten, ältere rollen nach
     oben aus dem Kasten. Nur auf breiten Fenstern; schmal bleibt der Text
     unter dem Ball. */
  .protokoll{display:none}
  @media (min-width:900px){
    .protokoll{
      display:flex;flex-direction:column;gap:12px;position:fixed;z-index:2;
      right:clamp(18px,3vw,48px);top:50%;transform:translateY(-10%);
      width:min(24vw,380px);height:min(46vh,480px);overflow-y:auto;overscroll-behavior:contain;
      padding:16px 18px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(5,7,12,.72);
      font-size:15px;line-height:1.5;user-select:text;-webkit-user-select:text;scrollbar-width:thin;
      mask-image:linear-gradient(to bottom,transparent 0,#000 28px);-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 28px);
    }
    .protokoll:empty{display:none}
    .protokoll > :first-child{margin-top:auto}
    .protokoll .du{color:var(--leise)}
    .protokoll .aura{color:var(--text)}
    .protokoll .wer{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--akt);margin-bottom:2px}
    body.abgemeldet .protokoll{display:none}
    /* Der Wortlaut steht rechts; mittig nur Zustand und kurze Hinweise */
    .gehoert{visibility:hidden}
    .zeile.antwort{visibility:hidden}
  }
</style>
</head>
<body class="abgemeldet">
<canvas id="orb"></canvas>
<div class="protokoll" id="protokoll" aria-live="polite"></div>
<div class="eigentum">Aura · Eigentum der TR-Management</div>
<div class="rahmen">
  <div class="logo">AURA</div>
  <div class="orbplatz" id="orbplatz" aria-label="Aura – tippen zum Sprechen" role="button"></div>
  <div class="wort" id="wort">bereit</div>

  <form id="anmeldung" autocomplete="on">
    <button id="microsoft" type="button">Mit Microsoft anmelden</button>
    <div class="oder">oder mit E-Mail und Passwort</div>
    <input id="email" type="email" placeholder="E-Mail" autocomplete="username" autocapitalize="off" required>
    <input id="passwort" type="password" placeholder="Passwort" autocomplete="current-password" required>
    <button id="los" type="submit">Anmelden</button>
    <div class="meldung" id="meldung"></div>
  </form>

  <div class="gespraech">
    <div class="gehoert" id="gehoert"></div>
    <div class="zeile" id="zeile">Tippe auf den Ball und sprich.</div>
    <div class="hilfe">Tippen: zuhören · nochmal tippen: beenden <span id="m365" hidden>· <button class="abmelden" type="button">Microsoft verbinden</button></span> <span id="freigaben-knopf" hidden>· <button class="abmelden" type="button">Freigaben</button></span> · <button class="abmelden" id="konten-knopf" type="button">Konten</button> · <button class="abmelden" id="abmelden" type="button">abmelden</button></div>
  </div>
  <div class="tafel" id="tafel" hidden>
    <button class="abmelden schliessen" type="button" id="tafel-zu">schließen</button>
    <div id="tafel-inhalt"></div>
  </div>
</div>
<script src="konfig.js?v=20260928185412"></script>
<script src="anmeldung.js?v=20260928185412"></script>
<script src="orb.js?v=20260928185412"></script>
<script src="konsole.js?v=20260928185412"></script>
</body>
</html>
